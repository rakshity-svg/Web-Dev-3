<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Color Square Transition — HTML & CSS</title>
  <style>
    :root{
      --size: 160px;
      --gap: 24px;
      --bg: #0f172a;
      --card: #0b1220;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{display:grid;place-items:center;padding:32px;background:linear-gradient(180deg,#071021 0%, #081428 100%);color:#e6eef8}

    .wrap{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:28px;border-radius:14px;box-shadow:0 8px 30px rgba(2,6,23,0.6);display:inline-grid;gap:var(--gap);align-items:center}

    /* The square */
    .square{
      width:var(--size);
      height:var(--size);
      background:linear-gradient(135deg,#ff6b6b,#ffd166);
      border-radius:8px;
      display:grid;place-items:center;
      color:#081428;font-weight:700;
      transition:
        background-color 450ms cubic-bezier(.22,.9,.31,1),
        transform 450ms cubic-bezier(.22,.9,.31,1),
        width 450ms cubic-bezier(.22,.9,.31,1),
        height 450ms cubic-bezier(.22,.9,.31,1),
        border-radius 450ms cubic-bezier(.22,.9,.31,1),
        box-shadow 450ms cubic-bezier(.22,.9,.31,1);
      box-shadow: 0 8px 24px rgba(255,107,107,0.18);
      cursor:pointer;
      user-select:none;
    }

    /* Hover state */
    .square:hover{
      transform: translateY(-8px) rotate(-4deg) scale(1.06);
      background: linear-gradient(135deg,#7b2ff7,#00d4ff);
      border-radius:26px;
      box-shadow: 0 18px 40px rgba(0,212,255,0.12);
    }

    /* Focus (keyboard) */
    .square:focus{outline:4px solid rgba(255,255,255,0.06);}

    /* Toggle state: clicking the label toggles the hidden checkbox which flips the square */
    input[type="checkbox"]{display:none}
    input[type="checkbox"]:checked + .square{
      transform: rotate(12deg) scale(0.86);
      width: calc(var(--size) * 1.4);
      height: calc(var(--size) * 0.86);
      border-radius:50%;
      background: linear-gradient(135deg,#22c55e,#16a34a);
      box-shadow: 0 28px 60px rgba(34,197,94,0.12);
      color: #ecfdf5;
    }

    /* A tiny accessibility nicety — respects prefers-reduced-motion */
    @media (prefers-reduced-motion: reduce){
      .square, .square:hover, input[type="checkbox"]:checked + .square{transition:none;transform:none}
    }

    .hint{font-size:13px;opacity:0.8}

    .controls{display:flex;gap:12px;align-items:center}

    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;color:inherit;font-size:13px}
    .btn:active{transform:translateY(1px)}

  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;gap:18px;align-items:center;flex-direction:column;">
      <div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;justify-content:center;">
        <!-- A hidden checkbox is used so the square can be toggled (no JS). Clicking the label toggles it. -->
        <label style="display:block">
          <input id="toggle" type="checkbox" />
          <div class="square" tabindex="0" role="button" aria-pressed="false">Click</div>
        </label>

        <!-- A hover-only square to show hover transitions separately -->
        <div class="square" title="Hover me">Hover</div>
      </div>

      <div class="controls">
        <div class="hint">Hover to change color+shape. Click the left square to toggle a different state (no JavaScript).</div>
      </div>
    </div>
  </div>

  <!-- Small script updates aria-pressed when the checkbox changes for better accessibility -->
  <script>
    const cb = document.getElementById('toggle');
    const sq = cb && cb.nextElementSibling;
    if(cb && sq){
      cb.addEventListener('change', ()=>{
        sq.setAttribute('aria-pressed', cb.checked ? 'true' : 'false');
      });
    }
  </script>
</body>
</html>
